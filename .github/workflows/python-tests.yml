name: Python package

on:
  push:
    branches: [ main, production-hardening-10-of-10, hardening-complete-2026-09-30 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Install FFmpeg for media integration tests
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
    - name: Install locked development environment
      run: uv sync --frozen --python "${{ matrix.python-version }}" --extra web --extra dev
    - name: Verify locked environment
      run: uv pip check
    - name: Verify lockfile is complete
      run: test -s uv.lock && grep -q '^version = ' uv.lock && grep -q '^requires-python' uv.lock
    - name: Check Ruff formatting on hardening modules
      run: uv run ruff format --check 01-MAIN-CODE/ai_video_factory/media_metadata.py 01-MAIN-CODE/ai_video_factory/resource_metrics.py 04-TESTS/tests/test_hardening_gap_closure.py
    - name: Compile Python sources
      run: uv run python -m compileall -q 01-MAIN-CODE 02-WEB-FILES 03-SIDE-CODE
    - name: Validate deployment boundary scripts
      run: |
        uv run python -m py_compile 06-CONFIG-AND-DEPLOYMENT/gunicorn.conf.py 06-CONFIG-AND-DEPLOYMENT/verify_human_acceptance.py
        bash -n 06-CONFIG-AND-DEPLOYMENT/target_v3_smoke.sh
        bash -n 06-CONFIG-AND-DEPLOYMENT/target_recovery_smoke.sh
    - name: Lint production Python for correctness
      run: uv run ruff check 01-MAIN-CODE 02-WEB-FILES 03-SIDE-CODE --select E9,F --ignore F401,F811,F841
    - name: Run repository security audit
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: uv run python -m ai_video_factory.security_audit .
    - name: Run 34-point readiness audit
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: uv run aivf-ready .
    - name: Type-check hardened production boundary
      run: uv run mypy
    - name: Smoke-test command entry points
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: |
        uv run python 01-MAIN-CODE/cli.py --help
        uv run python 01-MAIN-CODE/cli_v3.py --help
        uv run aivf --help
    - name: Verify roadmap runtime contracts
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: |
        uv run python -c "from ai_video_factory import content_factory; assert abs(sum(content_factory.adaptive_pacing([0.1,0.9,0.8], total_seconds=9))-9) < 0.01; assert 4 <= content_factory.choose_clip_count(20,0.1,45) <= 12; assert content_factory.detect_emotion('what really happened behind the hidden truth')['emotion'] == 'curious'"
    - name: Build and validate isolated wheel install
      env:
        FLASK_SECRET_KEY: ci-wheel-smoke-secret
        AIVF_DASHBOARD_TOKEN: ci-wheel-test-token
        AIVF_STATE_DIR: /tmp/aivf-wheel-state
        AIVF_UPLOAD_DIR: /tmp/aivf-wheel-uploads
        AIVF_OUTPUT_DIR: /tmp/aivf-wheel-output
      run: |
        set -euo pipefail
        rm -rf dist /tmp/aivf-wheel-test /tmp/aivf-wheel-work
        uv run python -m build --wheel --outdir dist
        uv run python -m venv /tmp/aivf-wheel-test
        WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
        test -n "$WHEEL"
        /tmp/aivf-wheel-test/bin/python -m pip install "${WHEEL}[web]"
        cd /tmp
        /tmp/aivf-wheel-test/bin/aivf --help
        /tmp/aivf-wheel-test/bin/aivf-content --help
        /tmp/aivf-wheel-test/bin/aivf-v3 --help
        /tmp/aivf-wheel-test/bin/aivf-ready .
        /tmp/aivf-wheel-test/bin/python -c "import os; import ai_video_factory; import app.cli; import app.web_app_v3; from app import wsgi; assert os.path.isdir(app.web_app_v3.app.template_folder); assert os.path.isdir(app.web_app_v3.app.static_folder); assert wsgi.app is app.web_app_v3.app; response=wsgi.app.test_client().get('/api/health'); assert response.status_code == 200; print('isolated wheel runtime ok')"
        /tmp/aivf-wheel-test/bin/python -c "from importlib import metadata as m; eps=m.entry_points(); group=eps.select(group='console_scripts') if hasattr(eps,'select') else eps.get('console_scripts', ()); names={ep.name:ep.value for ep in group}; assert names['aivf']=='app.cli:main'; assert names['aivf-content']=='app.content_factory_cli:main'; assert names['aivf-v3']=='ai_video_factory.v3_cli:main'"
    - name: Run production guardrail regression tests
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: uv run pytest -q 04-TESTS/tests/test_production_guardrails.py 04-TESTS/tests/test_production_readiness_closure.py

    - name: Verify reproducible wheel build
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: uv run --with setuptools python -c "from ai_video_factory.reproducible_build import build_twice; result=build_twice('.'); assert result['byte_identical'], result"

    - name: Run V3 test group with explicit coverage accounting
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: >-
        uv run pytest -q 04-TESTS/tests/test_v3_*.py
        --cov=ai_video_factory.v3_engine
        --cov=ai_video_factory.v3_semantics
        --cov=ai_video_factory.v3_quality
        --cov=ai_video_factory.v3_capabilities
        --cov=ai_video_factory.v3_pipeline
        --cov=ai_video_factory.edit_planner
        --cov=ai_video_factory.effects_engine
        --cov=ai_video_factory.render_engine
        --cov=ai_video_factory.composer
        --cov=dashboard_auth
        --cov=dashboard_worker
        --cov=dashboard_compat
        --cov=dashboard_optimizations
        --cov=resource_governor
        --cov-report=term-missing
        --cov-report=xml
        --cov-fail-under=0

    - name: Run dashboard and job-service test group
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: >-
        uv run pytest -q
        04-TESTS/tests/test_dashboard_*.py
        04-TESTS/tests/test_job_service.py
        04-TESTS/tests/test_config_roundtrip.py
        --cov=ai_video_factory.v3_engine --cov=ai_video_factory.v3_semantics --cov=ai_video_factory.v3_quality
        --cov=ai_video_factory.v3_capabilities --cov=ai_video_factory.v3_pipeline
        --cov=ai_video_factory.edit_planner --cov=ai_video_factory.effects_engine --cov=ai_video_factory.render_engine
        --cov=ai_video_factory.composer --cov=dashboard_auth --cov=dashboard_worker --cov=dashboard_compat
        --cov=dashboard_optimizations --cov=resource_governor --cov-report=term-missing --cov-append --cov-fail-under=0

    - name: Run media and rendering test group
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: >-
        uv run pytest -q
        04-TESTS/tests/test_media_*.py
        04-TESTS/tests/test_render_engine*.py
        04-TESTS/tests/test_real_media_health.py
        04-TESTS/tests/test_real_render_integration.py
        04-TESTS/tests/test_quality_control_v3.py
        04-TESTS/tests/test_v3_golden_media.py
        04-TESTS/tests/test_v3_retention_independence.py
        04-TESTS/tests/test_v3_effect_mapping.py
        --cov=ai_video_factory.v3_engine --cov=ai_video_factory.v3_semantics --cov=ai_video_factory.v3_quality
        --cov=ai_video_factory.v3_capabilities --cov=ai_video_factory.v3_pipeline
        --cov=ai_video_factory.edit_planner --cov=ai_video_factory.effects_engine --cov=ai_video_factory.render_engine
        --cov=ai_video_factory.composer --cov=dashboard_auth --cov=dashboard_worker --cov=dashboard_compat
        --cov=dashboard_optimizations --cov=resource_governor --cov-report=term-missing --cov-append --cov-fail-under=0

    - name: Run remaining repository tests
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: >-
        uv run pytest -q
        04-TESTS/tests
        --ignore-glob=04-TESTS/tests/test_v3_*.py
        --ignore-glob=04-TESTS/tests/test_dashboard_*.py
        --ignore=04-TESTS/tests/test_job_service.py
        --ignore=04-TESTS/tests/test_config_roundtrip.py
        --ignore-glob=04-TESTS/tests/test_media_*.py
        --ignore-glob=04-TESTS/tests/test_render_engine*.py
        --ignore=04-TESTS/tests/test_real_media_health.py
        --ignore=04-TESTS/tests/test_real_render_integration.py
        --ignore=04-TESTS/tests/test_quality_control_v3.py
        --ignore=04-TESTS/tests/test_v3_golden_media.py
        --ignore=04-TESTS/tests/test_v3_retention_independence.py
        --ignore=04-TESTS/tests/test_v3_effect_mapping.py
        --cov=ai_video_factory.v3_engine --cov=ai_video_factory.v3_semantics --cov=ai_video_factory.v3_quality
        --cov=ai_video_factory.v3_capabilities --cov=ai_video_factory.v3_pipeline
        --cov=ai_video_factory.edit_planner --cov=ai_video_factory.effects_engine --cov=ai_video_factory.render_engine
        --cov=ai_video_factory.composer --cov=dashboard_auth --cov=dashboard_worker --cov=dashboard_compat
        --cov=dashboard_optimizations --cov=resource_governor --cov-report=term-missing --cov-append --cov-fail-under=0

    - name: Enforce V3 core coverage gate
      run: >-
        uv run coverage report
        --include='01-MAIN-CODE/ai_video_factory/v3_engine.py,01-MAIN-CODE/ai_video_factory/v3_semantics.py,01-MAIN-CODE/ai_video_factory/v3_quality.py,01-MAIN-CODE/ai_video_factory/v3_capabilities.py,01-MAIN-CODE/ai_video_factory/v3_pipeline.py,01-MAIN-CODE/ai_video_factory/edit_planner.py,01-MAIN-CODE/ai_video_factory/effects_engine.py,01-MAIN-CODE/ai_video_factory/render_engine.py'
        --fail-under=80

    - name: Enforce composer compatibility coverage gate
      run: >-
        uv run coverage report
        --include='01-MAIN-CODE/ai_video_factory/composer.py'
        --fail-under=50

    - name: Enforce production-boundary coverage gates
      shell: bash
      run: |
        set -euo pipefail
        uv run coverage report --include='01-MAIN-CODE/dashboard_auth.py' --fail-under=80
        uv run coverage report --include='01-MAIN-CODE/dashboard_worker.py' --fail-under=30
        uv run coverage report --include='01-MAIN-CODE/dashboard_compat.py' --fail-under=20
        uv run coverage report --include='01-MAIN-CODE/dashboard_optimizations.py' --fail-under=40
        uv run coverage report --include='01-MAIN-CODE/resource_governor.py' --fail-under=80

  media-and-platform-smoke:
    name: Media/platform smoke
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
    - name: Install locked environment
      run: uv sync --frozen --python 3.12 --extra web --extra dev
    - name: Generate compatibility fixtures
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/aivf-media
        ffmpeg -y -f lavfi -i 'testsrc2=size=640x360:rate=30000/1001:duration=3' -f lavfi -i 'anullsrc=r=48000:cl=stereo' -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/aivf-media/cfr.mp4
        ffmpeg -y -f lavfi -i 'testsrc2=size=640x360:rate=30:duration=3' -f lavfi -i 'sine=frequency=1000:sample_rate=48000:duration=3' -filter_complex "[0:v]select='if(lt(n,45),1,not(mod(n,3)))',setpts='if(lt(N,45),N/(30*TB),(45+(N-45)*1.5)/(30*TB))'[v]" -map '[v]' -map 1:a -shortest -fps_mode:v vfr -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/aivf-media/vfr.mp4
        ffmpeg -y -f lavfi -i 'testsrc2=size=640x360:rate=25:duration=2' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=2' -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/aivf-media/h264.mp4
    - name: Run compatibility matrix and benchmark
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: |
        uv run aivf-compat /tmp/aivf-media/*.mp4
        uv run python -c "from ai_video_factory.benchmark import benchmark_media; print(benchmark_media('/tmp/aivf-media/cfr.mp4'))"
    - name: Exercise large-file filesystem smoke
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: uv run python -c "from ai_video_factory.large_media_smoke import create_sparse_file, smoke_large_file; p=create_sparse_file('/tmp/aivf-10gb-sparse.bin',10.0); print(smoke_large_file(p))"
  macos-smoke:
    name: macOS production smoke
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
    - name: Install locked environment
      run: uv sync --frozen --python 3.12 --extra web --extra dev
    - name: Compile production Python
      run: uv run python -m compileall -q 01-MAIN-CODE 02-WEB-FILES 03-SIDE-CODE

  windows-smoke:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
    - name: Install locked development environment
      shell: pwsh
      run: uv sync --frozen --python 3.12 --extra web --extra dev
    - name: Install FFmpeg
      shell: pwsh
      run: |
        choco install ffmpeg -y --no-progress
        ffmpeg -version
        ffprobe -version
    - name: Verify locked environment
      shell: pwsh
      run: uv pip check
    - name: Compile spawn-sensitive modules
      shell: pwsh
      run: uv run python -m compileall -q 01-MAIN-CODE 02-WEB-FILES 03-SIDE-CODE
    - name: Verify dashboard support modules
      shell: pwsh
      env:
        PYTHONPATH: 01-MAIN-CODE;02-WEB-FILES;03-SIDE-CODE
      run: uv run python -c "from app import upload_cleanup; assert callable(upload_cleanup.cleanup_orphan_uploads)"
    - name: Exercise real Windows FFmpeg path
      shell: pwsh
      env:
        PYTHONPATH: 01-MAIN-CODE;02-WEB-FILES;03-SIDE-CODE
      run: |
        $video = Join-Path $env:RUNNER_TEMP 'aivf-windows-smoke.mp4'
        ffmpeg -y -f lavfi -i 'color=c=black:s=320x240:d=1' -f lavfi -i 'anullsrc=r=48000:cl=mono' -shortest -c:v libx264 -c:a aac $video
        uv run python -c "from ai_video_factory.render_engine import validate_media_output; validate_media_output(r'$video', require_video=True, require_audio=True)"
    - name: Exercise spawned worker bootstrap
      shell: pwsh
      env:
        PYTHONPATH: 01-MAIN-CODE;02-WEB-FILES;03-SIDE-CODE
      run: |
        $script = Join-Path $env:RUNNER_TEMP 'aivf-worker-bootstrap.py'
        @'
        import multiprocessing
        import dashboard_worker

        def main():
            ctx = multiprocessing.get_context('spawn')
            process = ctx.Process(
                target=dashboard_worker.run_job,
                args=('windows-bootstrap-smoke', {'workflow': 'not-a-workflow'}, {}, 'output', 'state/jobs.db'),
            )
            process.start()
            process.join(30)
            assert process.pid is not None
            assert process.exitcode is not None
            assert process.exitcode != 0

        if __name__ == '__main__':
            main()
        '@ | Set-Content -Path $script -Encoding utf8
        uv run python $script
    - name: Run Windows-safe hardening tests
      shell: pwsh
      env:
        PYTHONPATH: 01-MAIN-CODE;02-WEB-FILES;03-SIDE-CODE
      run: uv run pytest -q 04-TESTS/tests/test_dashboard_auth.py 04-TESTS/tests/test_dashboard_security.py 04-TESTS/tests/test_dashboard_lifecycle.py 04-TESTS/tests/test_config_roundtrip.py 04-TESTS/tests/test_model_adapter_security.py 04-TESTS/tests/test_pipeline_retry_policy.py 04-TESTS/tests/test_upload_cleanup.py

  dependency-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
    - name: Install locked audit environment
      run: uv sync --frozen --python 3.12 --extra web --extra dev --extra audit
    - name: Verify locked environment
      run: uv pip check
    - name: Audit dependencies
      run: uv run pip-audit
