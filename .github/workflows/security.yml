name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          category: /language:python

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
      - name: Install audit environment
        run: uv sync --frozen --python 3.12 --extra web --extra dev --extra audit
      - name: Verify environment
        run: uv pip check
      - name: Audit dependencies
        run: uv run pip-audit

  snyk:
    name: Snyk Open Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
      - name: Detect Snyk configuration
        id: snyk_config
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Export locked application dependencies
        if: steps.snyk_config.outputs.configured == 'true'
        run: uv export --locked --format requirements-txt --no-hashes --extra web --extra dev --extra audit --output-file "$RUNNER_TEMP/aivf-snyk-requirements.txt"
      - name: Snyk dependency scan
        if: steps.snyk_config.outputs.configured == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/aivf-snyk-requirements.txt"
          npx --yes snyk@1.1307.2 test \
            --file="$RUNNER_TEMP/aivf-snyk-requirements.txt" \
            --package-manager=pip \
            --command=python \
            --severity-threshold=high
      - name: Explain optional configuration
        if: steps.snyk_config.outputs.configured == 'false'
        run: echo "SNYK_TOKEN is not configured; Snyk scan skipped without failing CI."
