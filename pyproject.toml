[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-factory"
version = "3.0.0"
description = "Emotion-first AI short-form video planning, production, retention, and packaging."
requires-python = ">=3.10"
license = "LicenseRef-Edit-Factory-Source-Available"
license-files = ["LICENSE"]
dependencies = ["pillow>=9.0.0", "requests>=2.28.0", "urllib3>=2.8.0", "edge-tts>=6.1.0", "numpy>=1.23.0", "pydantic>=2.7.0"]

[project.scripts]
aivf = "app.cli:main"
aivf-diagnose = "ai_video_factory.diagnostics_cli:main"
aivf-ready = "ai_video_factory.production_readiness:main"
aivf-hardware-smoke = "ai_video_factory.hardware_smoke:main"
aivf-compat = "ai_video_factory.compatibility_cli:main"
aivf-content = "app.content_factory_cli:main"
aivf-v3 = "ai_video_factory.v3_cli:main"

[project.optional-dependencies]
web = ["flask>=2.3.0", "gunicorn>=22.0.0; platform_system != 'Windows'"]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "mypy>=1.0", "ruff>=0.6.0", "build>=1.2.0"]
audit = ["pip-audit>=2.9.0"]
beats = ["librosa>=0.10.0"]
vision = ["opencv-python-headless>=4.8.0"]
ocr = ["pytesseract>=0.3.10", "opencv-python-headless>=4.8.0"]
diarization = ["pyannote.audio>=3.1.0"]
intelligence = ["sentence-transformers>=3.0.0"]
full = ["librosa>=0.10.0", "opencv-python-headless>=4.8.0", "pytesseract>=0.3.10", "pyannote.audio>=3.1.0", "sentence-transformers>=3.0.0"]
groq = ["groq>=0.4.0"]
elevenlabs = ["elevenlabs>=0.2.0"]
youtube = ["google-api-python-client>=2.100.0", "google-auth>=2.30.0", "google-auth-oauthlib>=1.2.0"]

[tool.setuptools]
package-dir = {"" = "01-MAIN-CODE", "app" = "02-WEB-FILES/app", "tools" = "03-SIDE-CODE/tools"}
packages = ["ai_video_factory", "ai_video_factory.v3", "app", "tools"]
py-modules = ["cli", "dashboard_auth", "dashboard_cache", "dashboard_compat", "dashboard_optimizations", "dashboard_shutdown", "dashboard_store", "dashboard_worker", "resource_governor", "wsgi"]

[tool.setuptools.data-files]
"share/ai-video-factory/templates" = ["02-WEB-FILES/templates/index.html", "02-WEB-FILES/templates/login.html", "02-WEB-FILES/templates/minecraft_betrayal.json"]
"share/ai-video-factory/static/css" = ["02-WEB-FILES/static/css/style.css", "02-WEB-FILES/static/css/enhancements.css"]
"share/ai-video-factory/static/js" = ["02-WEB-FILES/static/js/dashboard_enhancements.js"]

[tool.pytest.ini_options]
markers = ["integration: tests that execute external media/runtime components such as FFmpeg"]

[tool.mypy]
# Keep runtime support at Python 3.10 while allowing current dependency stubs to parse.
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
