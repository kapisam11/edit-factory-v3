name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:python

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install audit environment
        run: uv sync --frozen --python 3.12 --extra web --extra dev --extra audit
      - name: Verify environment
        run: uv pip check
      - name: Audit dependencies
        run: uv run pip-audit

  snyk:
    name: Snyk Open Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build locked dependency environment
        if: ${{ secrets.SNYK_TOKEN != '' }}
        run: uv sync --frozen --python 3.12 --extra web --extra dev --extra audit
      - name: Export locked dependency manifest
        if: ${{ secrets.SNYK_TOKEN != '' }}
        run: uv export --locked --format requirements-txt --all-extras --no-hashes --output-file "$RUNNER_TEMP/aivf-snyk-requirements.txt"
      - name: Snyk dependency scan
        if: ${{ secrets.SNYK_TOKEN != '' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npx --yes snyk@latest test \
            --file="$RUNNER_TEMP/aivf-snyk-requirements.txt" \
            --package-manager=pip \
            --command=python \
            --severity-threshold=high
      - name: Explain optional configuration
        if: ${{ secrets.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN is not configured; Snyk scan skipped without failing CI."
