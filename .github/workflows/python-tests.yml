name: Python package

on:
  push:
    branches: [ main, production-hardening-10-of-10 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Install FFmpeg for media integration tests
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        enable-cache: true
    - name: Install locked development environment
      run: uv sync --frozen --python "${{ matrix.python-version }}" --extra web --extra dev
    - name: Verify locked environment
      run: uv pip check
    - name: Compile Python sources
      run: uv run python -m compileall -q 01-MAIN-CODE 02-WEB-FILES 03-SIDE-CODE
    - name: Lint production Python
      run: uv run ruff check 01-MAIN-CODE 02-WEB-FILES 03-SIDE-CODE --select E9,F,I --ignore F401,F811,F841
    - name: Type-check hardened production boundary
      run: uv run mypy
    - name: Smoke-test command entry points
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: |
        uv run python 01-MAIN-CODE/cli.py --help
        uv run python 01-MAIN-CODE/cli_v3.py --help
        uv run aivf --help
    - name: Verify roadmap runtime contracts
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: |
        uv run python -c "from ai_video_factory import content_factory; assert abs(sum(content_factory.adaptive_pacing([0.1,0.9,0.8], total_seconds=9))-9) < 0.01; assert 4 <= content_factory.choose_clip_count(20,0.1,45) <= 12; assert content_factory.detect_emotion('what really happened behind the hidden truth')['emotion'] == 'curious'"
    - name: Build and validate isolated wheel install
      env:
        FLASK_SECRET_KEY: ci-wheel-smoke-secret
        AIVF_DASHBOARD_TOKEN: ci-wheel-test-token
        AIVF_STATE_DIR: /tmp/aivf-wheel-state
        AIVF_UPLOAD_DIR: /tmp/aivf-wheel-uploads
        AIVF_OUTPUT_DIR: /tmp/aivf-wheel-output
      run: |
        set -euo pipefail
        rm -rf dist /tmp/aivf-wheel-test /tmp/aivf-wheel-work
        uv run python -m build --wheel --outdir dist
        uv run python -m venv /tmp/aivf-wheel-test
        WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
        test -n "$WHEEL"
        /tmp/aivf-wheel-test/bin/python -m pip install "${WHEEL}[web]"
        cd /tmp
        /tmp/aivf-wheel-test/bin/aivf --help
        /tmp/aivf-wheel-test/bin/aivf-content --help
        /tmp/aivf-wheel-test/bin/aivf-v3 --help
        /tmp/aivf-wheel-test/bin/python -c "import os; import ai_video_factory; import app.cli; import app.web_app_v3; from app import wsgi; assert os.path.isdir(app.web_app_v3.app.template_folder); assert os.path.isdir(app.web_app_v3.app.static_folder); assert wsgi.app is app.web_app_v3.app; response=wsgi.app.test_client().get('/api/health'); assert response.status_code == 200; print('isolated wheel runtime ok')"
        /tmp/aivf-wheel-test/bin/python -c "from importlib import metadata as m; eps=m.entry_points(); group=eps.select(group='console_scripts') if hasattr(eps,'select') else eps.get('console_scripts', ()); names={ep.name:ep.value for ep in group}; assert names['aivf']=='app.cli:main'; assert names['aivf-content']=='app.content_factory_cli:main'; assert names['aivf-v3']=='ai_video_factory.v3_cli:main'"
    - name: Run tests with V3 core + production-boundary coverage gate
      env:
        PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
      run: >-
        uv run pytest -q 04-TESTS/tests
        --cov=ai_video_factory.v3_engine
        --cov=ai_video_factory.v3_semantics
        --cov=ai_video_factory.v3_quality
        --cov=ai_video_factory.v3_capabilities
        --cov=ai_video_factory.v3_pipeline
        --cov=ai_video_factory.edit_planner
        --cov=ai_video_factory.effects_engine
        --cov=ai_video_factory.render_engine
        --cov=dashboard_auth
        --cov=dashboard_worker
        --cov=dashboard_compat
        --cov=dashboard_optimizations
        --cov=resource_governor
        --cov=ai_video_factory.composer
        --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  windows-smoke:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        enable-cache: true
    - name: Install locked development environment
      shell: pwsh
      run: uv sync --frozen --python 3.12 --extra web --extra dev
    - name: Install FFmpeg
      shell: pwsh
      run: |
        choco install ffmpeg -y --no-progress
        ffmpeg -version
        ffprobe -version
    - name: Verify locked environment
      shell: pwsh
      run: uv pip check
    - name: Compile spawn-sensitive modules
      shell: pwsh
      run: uv run python -m compileall -q 01-MAIN-CODE 02-WEB-FILES 03-SIDE-CODE
    - name: Verify dashboard support modules
      shell: pwsh
      env:
        PYTHONPATH: 01-MAIN-CODE;02-WEB-FILES;03-SIDE-CODE
      run: uv run python -c "from app import upload_cleanup; assert callable(upload_cleanup.cleanup_orphan_uploads)"
    - name: Exercise real Windows FFmpeg path
      shell: pwsh
      env:
        PYTHONPATH: 01-MAIN-CODE;02-WEB-FILES;03-SIDE-CODE
      run: |
        $video = Join-Path $env:RUNNER_TEMP 'aivf-windows-smoke.mp4'
        ffmpeg -y -f lavfi -i 'color=c=black:s=320x240:d=1' -f lavfi -i 'anullsrc=r=48000:cl=mono' -shortest -c:v libx264 -c:a aac $video
        uv run python -c "from ai_video_factory.render_engine import validate_media_output; validate_media_output(r'$video', require_video=True, require_audio=True)"
    - name: Exercise spawned worker bootstrap
      shell: pwsh
      env:
        PYTHONPATH: 01-MAIN-CODE;02-WEB-FILES;03-SIDE-CODE
      run: |
        $script = Join-Path $env:RUNNER_TEMP 'aivf-worker-bootstrap.py'
        @'
        import multiprocessing
        import dashboard_worker

        def main():
            ctx = multiprocessing.get_context('spawn')
            process = ctx.Process(
                target=dashboard_worker.run_job,
                args=('windows-bootstrap-smoke', {'workflow': 'not-a-workflow'}, {}, 'output', 'state/jobs.db'),
            )
            process.start()
            process.join(30)
            assert process.pid is not None
            assert process.exitcode is not None
            assert process.exitcode != 0

        if __name__ == '__main__':
            main()
        '@ | Set-Content -Path $script -Encoding utf8
        uv run python $script
    - name: Run Windows-safe hardening tests
      shell: pwsh
      env:
        PYTHONPATH: 01-MAIN-CODE;02-WEB-FILES;03-SIDE-CODE
      run: uv run pytest -q 04-TESTS/tests/test_dashboard_auth.py 04-TESTS/tests/test_dashboard_security.py 04-TESTS/tests/test_dashboard_lifecycle.py 04-TESTS/tests/test_config_roundtrip.py 04-TESTS/tests/test_model_adapter_security.py 04-TESTS/tests/test_pipeline_retry_policy.py 04-TESTS/tests/test_upload_cleanup.py

  dependency-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        enable-cache: true
    - name: Install locked audit environment
      run: uv sync --frozen --python 3.12 --extra web --extra dev --extra audit
    - name: Verify locked environment
      run: uv pip check
    - name: Audit dependencies
      run: uv run pip-audit
