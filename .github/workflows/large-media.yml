name: Large media validation (manual)

on:
  workflow_dispatch:
    inputs:
      size_gb:
        description: "Sparse file size to exercise storage, hashing and cleanup paths"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  large-media:
    name: Large media storage validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --frozen --python 3.12 --extra dev
      - name: Exercise large-file storage path
        env:
          PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
          AIVF_LARGE_MEDIA_SIZE_GB: ${{ inputs.size_gb }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from ai_video_factory.large_media_smoke import create_sparse_file, smoke_large_file
          size = float(os.environ["AIVF_LARGE_MEDIA_SIZE_GB"])
          path = Path("/tmp/aivf-large-media.bin")
          create_sparse_file(path, size)
          report = smoke_large_file(path)
          print(report)
          assert report["size_bytes"] >= int(size * 1024**3)
          assert len(report["sha256"]) == 64
          PY
      - name: Run cache and storage cleanup validation
        env:
          PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from ai_video_factory.cache_lifecycle import CacheLifecycle
          root = Path("/tmp/aivf-cache")
          cache = CacheLifecycle(root, max_bytes=1024, ttl_seconds=3600)
          (root / "large.tmp").write_bytes(b"x" * 2048)
          result = cache.cleanup()
          print(result)
          assert result["size_evictions"] >= 1
          PY
