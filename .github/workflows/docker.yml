name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build -f 06-CONFIG-AND-DEPLOYMENT/Dockerfile -t edit-factory-v2:test .
      - name: Start production Gunicorn container
        run: |
          docker run -d --name edit-factory-v2-smoke \
            -e AIVF_ALLOW_INSECURE_LOCAL=1 \
            -e FLASK_SECRET_KEY=ci-smoke-test-secret-key \
            -e AIVF_DASHBOARD_TOKEN=ci-smoke-test-token \
            -p 18080:5000 \
            edit-factory-v2:test
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          docker logs edit-factory-v2-smoke
          exit 1
      - name: Verify container runs as non-root
        run: test "$(docker exec edit-factory-v2-smoke id -un)" = "aivf"
      - name: Stop smoke container
        if: always()
        run: docker rm -f edit-factory-v2-smoke
