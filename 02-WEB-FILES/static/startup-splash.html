<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Starting Edit Factory V3</title>
  <style>
    :root { color-scheme: dark; --bg:#07090e; --text:#f6f7fb; --muted:#919bad; --accent:#ff654f; --line:rgba(255,255,255,.1); }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { display:grid; place-items:center; background:radial-gradient(ellipse at 50% 42%,#182237 0%,#0b101a 35%,var(--bg) 75%); color:var(--text); font:16px/1.5 "Segoe UI",system-ui,sans-serif; }
    .ambient { position:fixed; inset:-30%; background:conic-gradient(from 0deg,transparent,rgba(255,101,79,.08),transparent,rgba(100,137,255,.09),transparent); filter:blur(75px); animation:orbit 18s linear infinite; }
    .grid { position:fixed; inset:0; opacity:.17; background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px); background-size:52px 52px; mask-image:radial-gradient(ellipse at center,#000,transparent 75%); }
    main { position:relative; z-index:1; width:min(560px,90vw); text-align:center; }
    .emblem { width:92px; height:92px; margin:0 auto 28px; display:grid; place-items:center; position:relative; border:1px solid rgba(255,125,105,.45); border-radius:28px; background:linear-gradient(145deg,rgba(255,101,79,.2),rgba(255,255,255,.025)); box-shadow:0 0 70px rgba(255,101,79,.13),inset 0 1px rgba(255,255,255,.1); font-size:2rem; font-weight:900; letter-spacing:-.1em; color:#ffb0a4; animation:float 4s ease-in-out infinite; }
    .emblem:before,.emblem:after { content:""; position:absolute; inset:-13px; border:1px solid rgba(255,126,105,.18); border-radius:35px; animation:pulse 3s ease-out infinite; }
    .emblem:after { animation-delay:1.5s; }
    .eyebrow { margin:0 0 12px; color:#ff9a8b; font-size:.7rem; font-weight:800; letter-spacing:.24em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.4rem,7vw,4.4rem); letter-spacing:-.075em; line-height:1; }
    h1 span { background:linear-gradient(100deg,#fff 5%,#ff9a8b 80%); color:transparent; background-clip:text; }
    .sub { margin:18px auto 36px; max-width:36ch; color:var(--muted); }
    .status { display:flex; align-items:center; justify-content:center; gap:10px; color:#dce3ee; font-size:.86rem; }
    .dot { width:8px; height:8px; border-radius:50%; background:#ff9a8b; box-shadow:0 0 15px rgba(255,101,79,.8); animation:blink 1.2s ease-in-out infinite; }
    .track { height:3px; margin:22px auto 0; width:min(300px,70vw); overflow:hidden; border-radius:99px; background:rgba(255,255,255,.08); }
    .track:after { content:""; display:block; width:40%; height:100%; border-radius:99px; background:linear-gradient(90deg,transparent,#ff654f,#ffc0b5,transparent); animation:scan 1.7s ease-in-out infinite; }
    .foot { margin-top:42px; color:#5e697c; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes float { 50% { transform:translateY(-7px) rotate(-2deg); } }
    @keyframes pulse { 0% { transform:scale(.92); opacity:.8; } 100% { transform:scale(1.22); opacity:0; } }
    @keyframes blink { 50% { opacity:.35; } }
    @keyframes scan { from { transform:translateX(-120%); } to { transform:translateX(300%); } }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after { animation-duration:8s !important; } }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div><div class="grid" aria-hidden="true"></div>
  <main>
    <div class="emblem" aria-hidden="true">EF</div>
    <p class="eyebrow">Creator workspace · V3</p>
    <h1>EDIT <span>FACTORY</span></h1>
    <p class="sub">Preparing your private studio. Starting the local engine, checking the dashboard, and bringing your workspace online.</p>
    <div class="status" role="status" aria-live="polite"><span class="dot"></span><span id="status">Waking up the creative engine…</span></div>
    <div class="track" aria-hidden="true"></div>
    <p class="foot">Local-first · Your workspace · Your control</p>
  </main>
  <script>
    const baseUrl = "__AIVF_BASE_URL__";
    const welcomeUri = "__AIVF_WELCOME_URI__";
    const statusLabel = document.getElementById("status");
    const messages = ["Waking up the creative engine…","Loading your production workspace…","Checking local services…","Almost ready…"];
    let attempt = 0;
    async function waitForDashboard() {
      while (true) {
        statusLabel.textContent = messages[Math.min(attempt, messages.length - 1)];
        try {
          // A local file cannot read the response body because it has an opaque origin.
          // no-cors still lets us detect that the loopback server is accepting requests.
          await fetch(baseUrl + "/api/health", { mode: "no-cors", cache: "no-store" });
          // The local welcome page works with both current source and pinned production images.
          window.location.replace(welcomeUri);
          return;
        } catch (_) {
          attempt += 1;
          await new Promise(resolve => setTimeout(resolve, 900));
        }
      }
    }
    waitForDashboard();
  </script>
</body>
</html>
