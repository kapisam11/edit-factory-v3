<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Video Factory Login</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 10vh auto; padding: 24px; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; box-sizing: border-box; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>AI Video Factory</h1>
  <p>Dashboard authentication required.</p>
  <form method="post">
    <input name="token" type="password" autocomplete="current-password" placeholder="Dashboard token" required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
