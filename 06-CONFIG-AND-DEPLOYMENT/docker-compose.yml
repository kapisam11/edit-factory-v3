services:
  web:
    image: ${AIVF_IMAGE:?AIVF_IMAGE must be pinned to an immutable tag or digest}
    build:
      context: ..
      dockerfile: 06-CONFIG-AND-DEPLOYMENT/Dockerfile
    ports:
      - "5000:5000"
    cpus: "${AIVF_CONTAINER_CPUS:-4}"
    mem_limit: "${AIVF_CONTAINER_MEM_LIMIT:-8g}"
    pids_limit: ${AIVF_CONTAINER_PIDS_LIMIT:-512}
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY}
      AIVF_DASHBOARD_TOKEN: ${AIVF_DASHBOARD_TOKEN:?set AIVF_DASHBOARD_TOKEN}
      AIVF_COOKIE_SECURE: ${AIVF_COOKIE_SECURE:-1}
      AIVF_STATE_DIR: /app/state
      AIVF_RETENTION_DAYS: ${AIVF_RETENTION_DAYS:-7}
      AIVF_CLEANUP_INTERVAL_SECONDS: ${AIVF_CLEANUP_INTERVAL_SECONDS:-21600}
      AIVF_MAX_CONCURRENT_JOBS: ${AIVF_MAX_CONCURRENT_JOBS:-2}
      AIVF_MAX_SSE_CONNECTIONS: ${AIVF_MAX_SSE_CONNECTIONS:-2}
      AIVF_V3_SEMANTIC_QC: ${AIVF_V3_SEMANTIC_QC:-1}
      AIVF_ENV: ${AIVF_ENV:-production}
      AIVF_REDIS_URL: ${AIVF_REDIS_URL:-}
      AIVF_MEDIA_MAX_INPUT_BYTES: ${AIVF_MEDIA_MAX_INPUT_BYTES:-2147483648}
      AIVF_MEDIA_MAX_DURATION_SECONDS: ${AIVF_MEDIA_MAX_DURATION_SECONDS:-900}
      AIVF_MEDIA_MAX_WIDTH: ${AIVF_MEDIA_MAX_WIDTH:-3840}
      AIVF_MEDIA_MAX_HEIGHT: ${AIVF_MEDIA_MAX_HEIGHT:-2160}
      AIVF_MEDIA_MAX_FPS: ${AIVF_MEDIA_MAX_FPS:-120}
      AIVF_MEDIA_MAX_AUDIO_CHANNELS: ${AIVF_MEDIA_MAX_AUDIO_CHANNELS:-8}
      AIVF_MEDIA_MAX_OUTPUT_BYTES: ${AIVF_MEDIA_MAX_OUTPUT_BYTES:-5368709120}
      AIVF_MEDIA_MAX_JOB_SECONDS: ${AIVF_MEDIA_MAX_JOB_SECONDS:-1800}
      AIVF_MEDIA_MIN_FREE_DISK_BYTES: ${AIVF_MEDIA_MIN_FREE_DISK_BYTES:-21474836480}
      AIVF_RESOURCE_CAPACITY_UNITS: ${AIVF_RESOURCE_CAPACITY_UNITS:-100}
      AIVF_MAX_RESERVED_MEMORY_BYTES: ${AIVF_MAX_RESERVED_MEMORY_BYTES:-8589934592}
      AIVF_RESOURCE_CLASS_LIGHT_CAPACITY: ${AIVF_RESOURCE_CLASS_LIGHT_CAPACITY:-4}
      AIVF_RESOURCE_CLASS_STANDARD_CAPACITY: ${AIVF_RESOURCE_CLASS_STANDARD_CAPACITY:-2}
      AIVF_RESOURCE_CLASS_HEAVY_CAPACITY: ${AIVF_RESOURCE_CLASS_HEAVY_CAPACITY:-1}
    volumes:
      - aivf-output:/app/output
      - aivf-uploads:/app/uploads
      - aivf-knowledge:/app/knowledge_base_v3
      - aivf-state:/app/state

volumes:
  aivf-output:
  aivf-uploads:
  aivf-knowledge:
  aivf-state:
