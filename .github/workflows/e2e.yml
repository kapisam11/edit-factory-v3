name: Dashboard E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dashboard environment
        run: uv sync --frozen --python 3.12 --extra web --extra dev --extra ocr
      - name: Start dashboard
        env:
          FLASK_SECRET_KEY: e2e-session-secret
          AIVF_DASHBOARD_TOKEN: e2e-dashboard-token
          AIVF_COOKIE_SECURE: "0"
          AIVF_STATE_DIR: ${{ runner.temp }}/aivf-state
          AIVF_UPLOAD_DIR: ${{ runner.temp }}/aivf-uploads
          AIVF_OUTPUT_DIR: ${{ runner.temp }}/aivf-output
          PYTHONPATH: 01-MAIN-CODE:02-WEB-FILES:03-SIDE-CODE
        run: |
          mkdir -p "$AIVF_STATE_DIR" "$AIVF_UPLOAD_DIR" "$AIVF_OUTPUT_DIR"
          nohup uv run gunicorn -c 06-CONFIG-AND-DEPLOYMENT/gunicorn.conf.py app.wsgi:app > "$RUNNER_TEMP/aivf-gunicorn.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/aivf-gunicorn.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/aivf-gunicorn.log"
          exit 1
      - name: Run authenticated dashboard flow
        env:
          AIVF_DASHBOARD_TOKEN: e2e-dashboard-token
          BASE_URL: http://127.0.0.1:5000
          COOKIE_JAR: ${{ runner.temp }}/aivf-cookies.txt
          RESULTS_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsS -c "$COOKIE_JAR" -b "$COOKIE_JAR" "$BASE_URL/login" > /dev/null
          curl -fsS -c "$COOKIE_JAR" -b "$COOKIE_JAR" -L \
            -d "token=$AIVF_DASHBOARD_TOKEN" "$BASE_URL/login" > /dev/null
          curl -fsS -b "$COOKIE_JAR" "$BASE_URL/api/jobs" > "$RESULTS_DIR/jobs.json"
          curl -fsS -b "$COOKIE_JAR" "$BASE_URL/api/queue/status" > "$RESULTS_DIR/queue.json"
          curl -fsS -b "$COOKIE_JAR" \
            -H "Origin: $BASE_URL" \
            -H "Content-Type: application/json" \
            -d '{"max_concurrent_jobs":1}' \
            "$BASE_URL/api/settings" > "$RESULTS_DIR/settings.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RESULTS_DIR"])
          settings = json.loads((root / "settings.json").read_text())
          assert settings["max_concurrent_jobs"] == 1
          jobs = json.loads((root / "jobs.json").read_text())
          assert isinstance(jobs, list)
          queue = json.loads((root / "queue.json").read_text())
          assert "queued" in queue and "running" in queue
          PY
      - name: Run real dashboard V3 production flow
        env:
          AIVF_DASHBOARD_TOKEN: e2e-dashboard-token
          BASE_URL: http://127.0.0.1:5000
          COOKIE_JAR: ${{ runner.temp }}/aivf-cookies.txt
          RESULTS_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ffmpeg -y -f lavfi -i testsrc=size=1080x1920:rate=24 -f lavfi -i anullsrc=r=48000:cl=mono -t 12 -shortest -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='The':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=100,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='part':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=255,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='of':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=410,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='setup':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=565,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='context':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=720,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='most':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=875,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='people':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=1030,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='miss':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=1185,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='question':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=1340,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='frame':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=1495,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Hook':fontcolor=white:borderw=6:bordercolor=black:fontsize=120:x=(w-text_w)/2:y=1650" -pix_fmt yuv420p -c:v libx264 -c:a aac "$RUNNER_TEMP/v3-source.mp4" >/dev/null 2>&1
          response=$(curl --fail-with-body -sS -b "$COOKIE_JAR" -c "$COOKIE_JAR" -H "Origin: $BASE_URL" -F "topic=setup context setup context setup context" -F "target_seconds=8" -F "workflow=v3" -F "platform=youtube_shorts" -F "audience=integration test viewers" -F "context=setup context setup context" -F "bpm=120" -F "enable_ocr=true" -F "enable_object_detection=false" -F "enable_diarization=false" -F "raw_video=@$RUNNER_TEMP/v3-source.mp4;type=video/mp4" "$BASE_URL/api/jobs")
          ffmpeg -y -ss 3 -i "$RUNNER_TEMP/v3-source.mp4" -frames:v 1 "$RUNNER_TEMP/v3-ocr-check.png" >/dev/null 2>&1
          tesseract "$RUNNER_TEMP/v3-ocr-check.png" stdout 2>/dev/null | tee "$RESULTS_DIR/v3-fixture-ocr.txt"
          grep -Eiq 'source|footage|answer|setup|evidence|payoff' "$RESULTS_DIR/v3-fixture-ocr.txt"
          printf '%s' "$response" > "$RESULTS_DIR/v3-create.json"
          JOB_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<<"$response")
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          for i in $(seq 1 180); do
            status=$(curl -fsS -b "$COOKIE_JAR" "$BASE_URL/api/jobs/$JOB_ID/status")
            printf '%s\n' "$status" > "$RESULTS_DIR/v3-status.json"
            state=$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$status")
            case "$state" in
              done) break ;;
              error|interrupted|cancelled)
                curl -fsS -b "$COOKIE_JAR" "$BASE_URL/api/jobs/$JOB_ID" > "$RESULTS_DIR/v3-job.json"
                cat "$RESULTS_DIR/v3-job.json"
                exit 1
                ;;
            esac
            sleep 2
          done
          final_state=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RESULTS_DIR/v3-status.json")
          test "$final_state" = "done"
          curl -fsS -b "$COOKIE_JAR" "$BASE_URL/api/jobs/$JOB_ID" > "$RESULTS_DIR/v3-job.json"
          PACKAGE=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["package_name"])' "$RESULTS_DIR/v3-job.json")
          test -n "$PACKAGE"
          PACKAGE_DIR="$RUNNER_TEMP/aivf-output/$PACKAGE"
          test -d "$PACKAGE_DIR"
          test -f "$PACKAGE_DIR/final.v3.mp4"
          test -f "$PACKAGE_DIR/v3_readiness.json"
          test -f "$PACKAGE_DIR/v3_render_qc.json"
          cp "$PACKAGE_DIR/v3_readiness.json" "$RESULTS_DIR/v3-readiness.json"
          cp "$PACKAGE_DIR/v3_render_qc.json" "$RESULTS_DIR/v3-render-qc.json"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$PACKAGE_DIR/final.v3.mp4"
          echo "Testing live preview endpoint..."
          curl --http1.1 --retry 2 --retry-all-errors --connect-timeout 5 --max-time 60             --fail --silent --show-error             --cookie "$COOKIE_JAR"             --dump-header "$RESULTS_DIR/v3-preview.headers"             --output "$RESULTS_DIR/v3-preview.mp4"             "$BASE_URL/api/jobs/$JOB_ID/preview"
          test -s "$RESULTS_DIR/v3-preview.mp4"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RESULTS_DIR/v3-preview.mp4"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RESULTS_DIR"])
          readiness = json.loads((root / "v3-readiness.json").read_text())
          render_qc = json.loads((root / "v3-render-qc.json").read_text())
          print("V3 READINESS:", json.dumps(readiness, indent=2))
          print("V3 RENDER QC:", json.dumps(render_qc, indent=2))
          if readiness["checks"].get("MEDIA_VALID") is not True: raise SystemExit(31)
          if readiness["checks"].get("MEDIA_CONTRACT_VALID") is not True: raise SystemExit(32)
          if readiness["checks"].get("UPLOAD_PACKAGE_VALID") is not True: raise SystemExit(33)
          if readiness.get("state") != "UPLOAD_PACKAGE_VALID": raise SystemExit(34)
          if render_qc.get("ok") is not True: raise SystemExit(35)
          if (render_qc.get("retention_verification") or {}).get("ok") is not True: raise SystemExit(36)
          PY
      - name: Verify cross-origin writes fail closed
        env:
          BASE_URL: http://127.0.0.1:5000
          COOKIE_JAR: ${{ runner.temp }}/aivf-cookies.txt
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/forbidden.json" -w '%{http_code}' \
            -X POST -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -d '{"max_concurrent_jobs":2}' \
            "$BASE_URL/api/settings")
          test "$code" = "403"
      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/aivf-gunicorn.log"
      - name: Stop dashboard
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/aivf-gunicorn.pid"; then
            kill "$(cat "$RUNNER_TEMP/aivf-gunicorn.pid")" || true
          fi
